services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: databasedemo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u root
          -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ../databasedemo
    image: databasedemo:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql:3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set_MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
