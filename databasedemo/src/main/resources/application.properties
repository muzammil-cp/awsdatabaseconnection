spring.application.name=databasedemo

# Set DB_HOST to hostname:port, for example localhost:3306 or your RDS endpoint:3306.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost:3306}/databasedemo?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
